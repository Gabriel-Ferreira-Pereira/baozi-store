spring.application.name=baozistore

# Banco de Dados MySQL (baozi_store criado automaticamente)
spring.datasource.url = jdbc:mysql://localhost:3306/baozi_store?createDatabaseIfNotExist=true
spring.datasource.username = root
spring.datasource.password = root

# JPA e Hibernate (para criar e atualizar as tabelas a partir das entidades)
spring.jpa.hibernate.ddl-auto = update
spring.jpa.show-sql = true
spring.jpa.open-in-view = false

# Mensagem de Erro para as Respostas da API
server.error.include-message = always
server.error.include-binding-errors = always